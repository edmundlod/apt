name: Add package to apt repo

on:
  repository_dispatch:
    types: [package-built, packages-built]
  workflow_dispatch:
    inputs:
      deb_url:
        description: Direct URL to .deb file
        required: true
      codename:
        description: Distribution codename (bookworm or trixie)
        required: true
        default: trixie

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  add-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install reprepro
        run: sudo apt-get install -y --no-install-recommends reprepro

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_SIGNING_KEY }}" | base64 -d | gpg --import
          echo "9FF41A44270A1D88226E50F3E75C78A28F60F730:6:" | gpg --import-ownertrust

      - name: Sync to latest main
        run: git fetch origin && git reset --hard origin/main

      - name: Download and add packages
        env:
          DEB_URLS: ${{ toJson(github.event.client_payload.deb_urls) }}
          DEB_URL: ${{ github.event.client_payload.deb_url || inputs.deb_url }}
          CODENAME: ${{ github.event.client_payload.codename || inputs.codename }}
        run: |
          add_deb() {
            local url="$1"
            echo "Downloading: $url"
            wget -q "$url" -O package.deb
            pkg_name=$(dpkg-deb --field package.deb Package)
            echo "Removing any existing $pkg_name from $CODENAME..."
            reprepro remove "$CODENAME" "$pkg_name" || true
            reprepro -V includedeb "$CODENAME" package.deb
            rm package.deb
          }
          if [ "$DEB_URLS" != "null" ] && [ -n "$DEB_URLS" ]; then
            echo "$DEB_URLS" | jq -r '.[]' | while read url; do
              add_deb "$url"
            done
          else
            add_deb "$DEB_URL"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dists/ pool/ db/
          git diff --cached --quiet || git commit -m "Add packages for ${{ github.event.client_payload.codename || inputs.codename }}"
          for i in $(seq 1 5); do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            [ "$i" -eq 5 ] && { echo "ERROR: All push attempts failed"; exit 1; }
            sleep $((RANDOM % 15 + 5))
          done
